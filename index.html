<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Circle Detection</title>
    <style>
        .container { text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        video { border-radius: 10px; background: #222; width: 100%; max-width: 500px; border: 3px solid #ddd; }
        .result { margin-top: 15px; font-weight: bold; font-size: 1.4rem; color: #333; }
        .remedy-box { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-left: 5px solid #28a745; display: none; }
        .remedy-box h4 { margin-top: 0; color: #28a745; }
        button { padding: 12px 24px; font-size: 1rem; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #218838; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Healthcare AI - Dark Circle Analysis</h2>
        <video id="video" autoplay playsinline></video>
        <br><br>
        <button id="startBtn">🟢 Start 10s Analysis</button>
        
        <div id="status" class="result">Ready</div>
        
        <div id="remedyContainer" class="remedy-box">
            <h4>💡 Recommended Remedies:</h4>
            <ul id="remedyList"></ul>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const canvas = document.getElementById('canvas');
        const remedyContainer = document.getElementById('remedyContainer');
        const remedyList = document.getElementById('remedyList');
        
        const API_URL = "https://dark-circle-api-lyal.onrender.com/darkcircle"; 

        async function startDetection() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                status.innerText = "Analyzing... keep your face steady and well-lit";
                remedyContainer.style.display = "none";
                remedyList.innerHTML = "";
                
                let lastResult = null;
                const duration = 10000; 
                const intervalTime = 2000; // Sample every 2 seconds to avoid overwhelming the free-tier API

                const interval = setInterval(async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('image', blob, 'frame.jpg');

                        try {
                            const response = await fetch(API_URL, { method: 'POST', body: formData });
                            const data = await response.json();
                            
                            // Store the most recent result
                            if (data.status) {
                                lastResult = data;
                            }
                        } catch (err) { console.error("API Error:", err); }
                    }, 'image/jpeg');

                }, intervalTime);

                setTimeout(() => {
                    clearInterval(interval);
                    stream.getTracks().forEach(track => track.stop());
                    
                    if (lastResult) {
                        status.innerText = lastResult.status;
                        
                        // Show remedies if they exist
                        if (lastResult.remedies && lastResult.remedies.length > 0) {
                            remedyContainer.style.display = "block";
                            lastResult.remedies.forEach(r => {
                                const li = document.createElement('li');
                                li.innerText = r;
                                remedyList.appendChild(li);
                            });
                        }
                    } else {
                        status.innerText = "Analysis failed. Try again.";
                    }
                }, duration);

            } catch (err) {
                status.innerText = "Webcam access denied or error occurred.";
            }
        }

        startBtn.addEventListener('click', startDetection);
    </script>
</body>
</html>
